name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant PR runs. NEVER cancel a post-merge run on main.
#
# The old form was `group: ci-${{ github.ref }}` + `cancel-in-progress: true`. Every
# merge to main shares the ref `refs/heads/main`, so each merge cancelled the
# PREVIOUS commit's post-merge run. On 2026-07-30 five voided main runs were
# observed across the two repos in one afternoon — FE #54's Playwright job, FE #53
# and FE #43 killed outright at 29s and 14s, BE #83 and BE #79 the same. A
# `cancelled` conclusion is not a pass and not a failure: it is no information, and
# it silently removed the only check that runs against the tree that actually
# shipped. FE #49 landing in the seconds between another PR's pre-merge SHA check
# and its merge is exactly the case this backstop exists for.
#
# Setting `cancel-in-progress: false` alone does NOT fix it. Per the workflow-syntax
# docs: "any existing `pending` job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place." During a merge
# train that still loses every run but the first in-progress and the last queued. So
# the GROUP has to differ per commit.
#
#   pull_request → group by ref, so a new push to a PR cancels its own older run.
#                  That cancelling is the point: the older run tests a tree nobody
#                  will merge.
#   push (main)  → group by SHA. Unique per commit, so no merge can cancel another
#                  commit's verification, and runs proceed in parallel rather than
#                  queueing behind each other.
#
# `cancel-in-progress` is still set from an expression rather than dropped, so the
# PR path keeps its old behaviour exactly.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholder env vars — real values live in Vercel for production. These
  # are required so the Next.js build doesn't fail on missing Clerk config;
  # all e2e tests use PROCULINK_QA_BYPASS_AUTH to bypass Clerk middleware.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_real
  CLERK_SECRET_KEY: sk_test_ci_placeholder_not_real
  # Disable Clerk keyless mode in CI. With a placeholder/empty publishable key in
  # development, @clerk/nextjs would otherwise auto-provision a throwaway Clerk app
  # and redirect to its "claim your application" page on any protected-route nav,
  # which breaks the e2e navigation tests. Keep Clerk dormant in mock/QA mode.
  NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: 'true'
  NEXT_PUBLIC_USE_MOCK: 'true'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:5223
  SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: '1'

jobs:
  build:
    name: Build (Next.js production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  test-unit:
    name: Unit tests + lint + conformance gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The workflow-level NEXT_PUBLIC_USE_MOCK=true exists for `build` and the Playwright
      # e2e job, which drive the app against the in-memory mock API. vitest must NOT inherit
      # it: several suites (src/lib/admin-guard.test.ts, src/lib/assignSupplier.test.ts) stub
      # fetch and assert the REAL api-client's HTTP behaviour — status codes, error bodies,
      # request shape. Under mock mode those calls are answered by mockAssignSupplier and the
      # mock admin guard instead, and 9 assertions fail for a reason that has nothing to do
      # with the code under test.
      #
      # `false` is what the committed .env sets, so CI now runs vitest exactly as a developer
      # does. Coverage of the MOCK path is WP-05's job (the mock/real parity harness), not an
      # accident of which env block a job happens to inherit.
      NEXT_PUBLIC_USE_MOCK: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each gate runs as its own step so a failure names itself in the checks UI.
      # `if: always()` keeps the later gates running after an earlier one fails, so one
      # push reports every problem instead of only the first.
      - name: Unit tests (vitest)
        run: bun run test

      - name: Lint (eslint)
        if: always()
        run: bun run lint

      - name: PageShell conformance
        if: always()
        run: bun run check:pageshell --strict

      - name: Vocabulary gate
        if: always()
        run: bun run lint:vocab

      # Design-token gate (WP-30). Fails on raw hex literals, per-page palette
      # constants, and inline-styled buttons under src/app — the two patterns
      # docs/design-system/11-unified-page-rules.md §Enforcement names, plus the
      # palette-constant ban from its rule 5. Pre-existing debt is held by a
      # per-file ratchet inside the script, so a listed page may shrink but never
      # grow and a new page must be at zero.
      - name: Design-token gate
        if: always()
        run: bun run lint:tokens

      # Emitted-CSS gate. The token gate above reads SOURCE TEXT, which is a
      # DIFFERENT SCANNER from the one that builds the stylesheet — and the two
      # disagreeing is not hypothetical, it shipped. tailwind.config.ts scanned
      # `./src/**/*.{ts,tsx}` with no test exclusion while both token guards skip
      # `*.test.ts(x)` on purpose, so Tailwind's content scanner (a regex over file
      # text) read the fixture string `focus-visible:ring-[#28C55E]` out of the very
      # test that pins the emerald ban and emitted the rule into production CSS.
      # Re-running the guard could never have caught it. This step asks the real
      # compiler what it actually emits, and matches decimal as well as hex —
      # Tailwind compiles that class to `rgb(40 197 94 / …)`.
      - name: Emitted-CSS gate
        if: always()
        run: bun run lint:emitted-css

      # Types are the one gate WP-01 left out, and the gap was not theoretical: by the time
      # this was added, main carried TWO type errors - one pre-existing in seo.test.ts and one
      # merged the same day via #52. tsconfig has strict:false and strictNullChecks:false, so
      # this catches only hard type errors, not nullability. It is still the difference between
      # a type regression shipping and a type regression failing a PR.
      - name: Typecheck (tsc --noEmit)
        if: always()
        run: bun run typecheck

  test-e2e:
    name: Playwright e2e (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROCULINK_QA_BYPASS_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests (mock mode)
        run: bun run test:e2e

      # WP-02 — a skipped test is not a failure, but it must not be invisible either.
      #
      # This job used to report green while 31 of its 111 tests skipped, because the
      # `github` reporter prints only failure annotations and Playwright's runner counts
      # `skipped` as a non-failure. Nothing in the log, the check name, or the (failure-only)
      # artifact said which tests did not run or why.
      #
      # This step never fails the build — the declared-condition skips are correct by design.
      # It prints them, with their reasons, into the job log AND the check summary, so the
      # count is a number somebody can look at and challenge.
      - name: Skipped Playwright tests
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const FILE = "test-results/results.json";
          const out = [];

          if (!fs.existsSync(FILE)) {
            out.push(`No Playwright JSON report at ${FILE} — the run did not get far enough to write one.`);
          } else {
            const report = JSON.parse(fs.readFileSync(FILE, "utf8"));
            const skipped = [];

            const walk = (suite, titles) => {
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  const status = t.status ?? t.results?.[0]?.status;
                  if (status !== "skipped") continue;
                  const reason = (t.annotations ?? [])
                    .filter((a) => a.type === "skip" || a.type === "fixme")
                    .map((a) => a.description || `(${a.type}, no reason given)`)
                    .join("; ");
                  skipped.push({
                    where: `${spec.file}:${spec.line}`,
                    title: [...titles, spec.title].join(" › "),
                    reason: reason || "(NO REASON RECORDED — the skip cannot be justified from the report)",
                  });
                }
              }
              for (const child of suite.suites ?? []) walk(child, [...titles, child.title]);
            };
            for (const s of report.suites ?? []) walk(s, []);

            const st = report.stats ?? {};
            out.push(
              `Playwright: ${st.expected ?? "?"} passed · ${st.skipped ?? skipped.length} skipped · ` +
                `${st.unexpected ?? "?"} failed · ${st.flaky ?? 0} flaky`,
            );
            out.push("");
            if (skipped.length === 0) {
              out.push("No skipped tests — every test in this run actually ran.");
            } else {
              out.push(`${skipped.length} test(s) did NOT run:`);
              for (const s of skipped) out.push(`  - ${s.title}\n      ${s.where}\n      reason: ${s.reason}`);
            }
          }

          const text = out.join("\n");
          console.log(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Playwright skips\n\n\`\`\`\n${text}\n\`\`\`\n`,
            );
          }
          NODE

      # Uploaded on EVERY run, not just failures: a green run that skipped a third of the
      # suite is exactly the run somebody needs the report for.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
