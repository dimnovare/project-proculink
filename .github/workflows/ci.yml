name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # WP-41 — how the visual baselines get regenerated.
  #
  # tests/e2e/__screenshots__ holds Linux PNGs that only match this runner. They
  # cannot be regenerated on a Windows or macOS machine: text rasterises
  # differently and every glyph diffs. So the runner regenerates them itself, on
  # the same image that compares them — which makes this the highest-fidelity
  # option available, not a workaround.
  #
  # `Regenerate baselines` runs test:e2e:visual:update, which rewrites ALL 30
  # PNGs, and `Upload regenerated baselines` uploads the whole directory. The
  # artifact is therefore never a diff. Download it straight into the committed
  # directory and you have overwritten every screen at once — including screens
  # your branch never touched — and `git add tests/e2e/__screenshots__` then
  # stages the lot as though someone had looked at it. Nobody can review a
  # 30-file binary diff and say which files their own change caused.
  #
  # So download to a TEMP directory, diff it against the committed baselines, and
  # copy across only the files your change accounts for:
  #
  #   gh workflow run ci.yml --ref <branch> -f regenerate_visual_baselines=true
  #   gh run download <run-id> -n visual-baselines -D /tmp/vb   # NOT tests/e2e/__screenshots__
  #
  #   # list what actually differs (bash; `cmp` is POSIX, so use Git Bash on Windows)
  #   for f in /tmp/vb/*.png; do
  #     cmp -s "$f" "tests/e2e/__screenshots__/$(basename "$f")" || echo "DIFFERS: $(basename "$f")"
  #   done
  #
  #   # then copy ONLY the ones you reviewed and can explain, by name
  #   cp /tmp/vb/<the-one-you-reviewed>.png tests/e2e/__screenshots__/
  #   git add tests/e2e/__screenshots__/<the-one-you-reviewed>.png && git commit
  #
  # A screen you did not touch turning up in that DIFFERS list is a FINDING to
  # investigate, not a file to copy. Either the change reaches further than you
  # thought, or a baseline is drifting on its own — a font, a dependency, a runner
  # image bump. Both are worth knowing; neither is fixed by committing the new
  # PNG. Work out which it is before that file moves.
  #
  # Review every PNG you do copy — each one is a visual change somebody should
  # have to look at. To see a diff WITHOUT regenerating, read the
  # `visual-report` artifact from the failing PR run; it carries
  # expected/actual/diff.
  workflow_dispatch:
    inputs:
      regenerate_visual_baselines:
        description: 'Regenerate the visual baselines and upload them as an artifact instead of comparing'
        type: boolean
        default: false

# Cancel redundant PR runs. NEVER cancel a post-merge run on main.
#
# The old form was `group: ci-${{ github.ref }}` + `cancel-in-progress: true`. Every
# merge to main shares the ref `refs/heads/main`, so each merge cancelled the
# PREVIOUS commit's post-merge run. On 2026-07-30 five voided main runs were
# observed across the two repos in one afternoon — FE #54's Playwright job, FE #53
# and FE #43 killed outright at 29s and 14s, BE #83 and BE #79 the same. A
# `cancelled` conclusion is not a pass and not a failure: it is no information, and
# it silently removed the only check that runs against the tree that actually
# shipped. FE #49 landing in the seconds between another PR's pre-merge SHA check
# and its merge is exactly the case this backstop exists for.
#
# Setting `cancel-in-progress: false` alone does NOT fix it. Per the workflow-syntax
# docs: "any existing `pending` job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place." During a merge
# train that still loses every run but the first in-progress and the last queued. So
# the GROUP has to differ per commit.
#
#   pull_request → group by ref, so a new push to a PR cancels its own older run.
#                  That cancelling is the point: the older run tests a tree nobody
#                  will merge.
#   push (main)  → group by SHA. Unique per commit, so no merge can cancel another
#                  commit's verification, and runs proceed in parallel rather than
#                  queueing behind each other.
#
# `cancel-in-progress` is still set from an expression rather than dropped, so the
# PR path keeps its old behaviour exactly.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholder env vars — real values live in Vercel for production. These
  # are required so the Next.js build doesn't fail on missing Clerk config;
  # all e2e tests use PROCULINK_QA_BYPASS_AUTH to bypass Clerk middleware.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_real
  CLERK_SECRET_KEY: sk_test_ci_placeholder_not_real
  # Disable Clerk keyless mode in CI. With a placeholder/empty publishable key in
  # development, @clerk/nextjs would otherwise auto-provision a throwaway Clerk app
  # and redirect to its "claim your application" page on any protected-route nav,
  # which breaks the e2e navigation tests. Keep Clerk dormant in mock/QA mode.
  NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: 'true'
  NEXT_PUBLIC_USE_MOCK: 'true'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:5223
  SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: '1'

jobs:
  build:
    name: Build (Next.js production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  test-unit:
    name: Unit tests + lint + conformance gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The workflow-level NEXT_PUBLIC_USE_MOCK=true exists for `build` and the Playwright
      # e2e job, which drive the app against the in-memory mock API. vitest must NOT inherit
      # it: several suites (src/lib/admin-guard.test.ts, src/lib/assignSupplier.test.ts) stub
      # fetch and assert the REAL api-client's HTTP behaviour — status codes, error bodies,
      # request shape. Under mock mode those calls are answered by mockAssignSupplier and the
      # mock admin guard instead, and 9 assertions fail for a reason that has nothing to do
      # with the code under test.
      #
      # `false` is what the committed .env sets, so CI now runs vitest exactly as a developer
      # does. Coverage of the MOCK path is WP-05's job (the mock/real parity harness), not an
      # accident of which env block a job happens to inherit.
      NEXT_PUBLIC_USE_MOCK: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each gate runs as its own step so a failure names itself in the checks UI.
      # `if: always()` keeps the later gates running after an earlier one fails, so one
      # push reports every problem instead of only the first.
      - name: Unit tests (vitest)
        run: bun run test

      - name: Lint (eslint)
        if: always()
        run: bun run lint

      - name: PageShell conformance
        if: always()
        run: bun run check:pageshell --strict

      - name: Vocabulary gate
        if: always()
        run: bun run lint:vocab

      # Design-token gate (WP-30). Fails on raw hex literals, per-page palette
      # constants, and inline-styled buttons under src/app — the two patterns
      # docs/design-system/11-unified-page-rules.md §Enforcement names, plus the
      # palette-constant ban from its rule 5. Pre-existing debt is held by a
      # per-file ratchet inside the script, so a listed page may shrink but never
      # grow and a new page must be at zero.
      - name: Design-token gate
        if: always()
        run: bun run lint:tokens

      # Card-surface gate. One card component (src/components/bridge/layout/Card.tsx)
      # and a semantic 3px edge applied by rule. Five card paths were converged into
      # it on 2026-08-13; the hand-rolled cards that remain are held by a per-file
      # ledger pinned in BOTH directions, so a file may shrink (re-cut the ledger)
      # but never grow, and a file with no row must be at zero. This gate sees a
      # card by its SHAPE — the MEANING of an edge value is pinned separately by
      # src/test/cardEdgeRule.test.tsx.
      - name: Card-surface gate
        if: always()
        run: bun run lint:cards

      # Emitted-CSS gate. The token gate above reads SOURCE TEXT, which is a
      # DIFFERENT SCANNER from the one that builds the stylesheet — and the two
      # disagreeing is not hypothetical, it shipped. tailwind.config.ts scanned
      # `./src/**/*.{ts,tsx}` with no test exclusion while both token guards skip
      # `*.test.ts(x)` on purpose, so Tailwind's content scanner (a regex over file
      # text) read the fixture string `focus-visible:ring-[#28C55E]` out of the very
      # test that pins the emerald ban and emitted the rule into production CSS.
      # Re-running the guard could never have caught it. This step asks the real
      # compiler what it actually emits, and matches decimal as well as hex —
      # Tailwind compiles that class to `rgb(40 197 94 / …)`.
      - name: Emitted-CSS gate
        if: always()
        run: bun run lint:emitted-css

      # Types are the one gate WP-01 left out, and the gap was not theoretical: by the time
      # this was added, main carried TWO type errors - one pre-existing in seo.test.ts and one
      # merged the same day via #52. tsconfig has strict:false and strictNullChecks:false, so
      # this catches only hard type errors, not nullability. It is still the difference between
      # a type regression shipping and a type regression failing a PR.
      - name: Typecheck (tsc --noEmit)
        if: always()
        run: bun run typecheck

  # ══ BEGIN backend-mirror job — one contiguous block, safe to move as a unit ══
  #
  # WHY THIS JOB EXISTS.
  #
  # src/lib/orderStatusManifest.ts is the frontend's single hand-kept copy of the
  # backend's order-status constants. It replaced nine separate hand-typed copies, and
  # src/test/backendMirror.test.ts diffs it against the real C# so that the copy is
  # CHECKABLE rather than merely annotated.
  #
  # That diff had never run in CI. It is `test.skipIf(!BACKEND)`, and this workflow
  # neither checked the backend out nor set PROCULINK_BACKEND_PATH, so every run
  # reported `backendMirror.test.ts (22 tests | 12 skipped)` and went green — see run
  # 31095963507 on main. The manifest was accurate the whole time, but by diligence,
  # not by enforcement, and the backend constants move. This job is the enforcement.
  #
  # HOW THE BACKEND IS OBTAINED, AND WHAT IT COSTS.
  #
  # dimnovare/ProcuLink is a PUBLIC repository, so actions/checkout reads it with the
  # default, automatically-provisioned GITHUB_TOKEN. No secret, no PAT, no deploy key,
  # and nothing to rotate — which also means this job works unchanged on a fork PR,
  # where repository secrets are not available.
  #
  # If the backend is ever made private, this checkout starts failing with a 404 and
  # the job goes RED. That is the correct direction to fail: the alternative — a job
  # that shrugs and passes when it cannot read the backend — is exactly the silent
  # no-op this job was created to remove. Making it private would need a read-only
  # credential added here (a fine-grained PAT with Contents:read on the backend repo,
  # or a deploy key), passed as `token:` below.
  #
  # NO `ref:` IS PINNED, DELIBERATELY.
  #
  # The checkout follows the backend's DEFAULT BRANCH. Pinning a SHA would defeat the
  # entire purpose: the guard exists to catch the backend MOVING, and a pinned mirror
  # only ever re-confirms the moment it was pinned.
  #
  # WHEN THE BACKEND LEGITIMATELY CHANGES A CONSTANT.
  #
  # This job then goes red on frontend PRs that did not touch anything related. That is
  # working as intended — the frontend's copy is now WRONG, and every screen reading it
  # is describing a state machine the API no longer has. The path forward is short:
  #
  #   1. Read the failure. It names the C# symbol, both sides of the diff, and what the
  #      drift would do to the UI (a control offered on a status the endpoint refuses
  #      can only answer 400).
  #   2. Update the affected rows in src/lib/orderStatusManifest.ts, and update the
  #      PROVENANCE header in that file with the backend SHA this job printed in its
  #      step summary.
  #   3. Reproduce locally before pushing:
  #        PROCULINK_BACKEND_PATH=/path/to/ProcuLink \
  #          bun run test src/test/backendMirror.test.ts
  #
  # If the frontend genuinely cannot follow yet — the backend shipped a status with no
  # UI treatment, say — that is a product gap the red is correctly reporting. Fix it or
  # decide it deliberately; do not re-skip the diff to get to green.
  backend-mirror:
    name: Backend constant mirror (orderStatusManifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # vitest asserts the REAL api-client's HTTP behaviour; mock mode answers those
      # calls itself. Same reason test-unit overrides it.
      NEXT_PUBLIC_USE_MOCK: 'false'
      # Turns "no backend checkout" from a legitimate skip into a build failure. Without
      # this the job could check nothing out and still report green, which is the state
      # this job was written to end.
      PROCULINK_REQUIRE_BACKEND_MIRROR: '1'
      PROCULINK_BACKEND_PATH: ${{ github.workspace }}/.backend-checkout

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend (dimnovare/ProcuLink, default branch)
        uses: actions/checkout@v4
        with:
          repository: dimnovare/ProcuLink
          path: .backend-checkout
          fetch-depth: 1
          # Both repos went PRIVATE on 2026-08-13, and the default GITHUB_TOKEN is scoped
          # to its own repository — so this checkout began failing with a 404, taking the
          # three guards below with it. Fine-grained PAT, Contents:read on both repos.
          #
          # If this ever fails with "Repository not found", check the token's EXPIRY before
          # anything else: it is the one part of this job that dies on a calendar rather
          # than on a code change, and the symptom is identical to the repo being renamed.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Record which backend commit this ran against
        run: |
          SHA="$(git -C .backend-checkout rev-parse HEAD)"
          echo "Mirror diffed against dimnovare/ProcuLink @ ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mirror diffed against dimnovare/ProcuLink @ ${SHA}"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Diff orderStatusManifest against the backend C#
        run: bun run test src/test/backendMirror.test.ts

      # The SAME backend checkout, asked a different question: not "do the constants still
      # match" but "does a sentence the backend composes use a word ProcuLink does not ship
      # to users". OrderProblemPanel renders `order.errorMessage` verbatim, so half the
      # user-facing copy in this product is written in C# and was outside the reach of
      # `lint:vocab`, which walks frontend source only.
      #
      # A SEPARATE STEP, not appended to the line above, so a failure names which question
      # went wrong in the job log without anyone opening the run.
      - name: Check backend user-facing copy against the vocabulary
        if: always()
        run: bun run test src/test/backendCopyVocabulary.test.ts

      # The SAME backend checkout again, for a third question: is the 403 code the frontend
      # branches on still the literal the C# gate emits? `requires_org_admin` decides whether a
      # refused customer is told to ask a colleague or to spend money, so a silent rename would
      # send every non-admin to the upgrade copy.
      #
      # It has to run HERE. The rest of this file's tests run in the unit-test job, which checks
      # no backend out — the mirror assertion is `it.skipIf(!BACKEND)`, so there it would report
      # green having compared nothing. A SEPARATE STEP, like the one above, so a failure names
      # which question went wrong without anyone opening the run.
      - name: Diff the org-admin refusal code against the backend C#
        if: always()
        run: bun run test src/test/orgAdminRefusal.test.ts

      # The SAME backend checkout, fourth question: does anything in this app actually CALL
      # each endpoint the backend exposes? An endpoint nothing calls is a door with no handle —
      # it can be documented, tested and deployed while no user can ever reach it.
      #
      # This step exists because the guard it runs had NEVER RUN. src/test/endpoint-reachability.test.ts
      # enumerates the backend's routes from a sibling checkout and skips its diff when none is
      # reachable; the unit-test job sets no PROCULINK_BACKEND_PATH, so in CI it reported green
      # having compared nothing — the identical failure described in this job's own header for
      # backendMirror.test.ts. That fix gave the MIRROR guard a checkout and left its SIBLING
      # skipping, which is how the gap survived: a guard is only as real as the job that runs it.
      #
      # Proven live on 2026-08-13: merging the per-tenant inbound-email endpoints (backend #190)
      # left three of them with no caller, and this assertion was red locally and green on GitHub
      # for as long as nobody ran it by hand.
      - name: Check every backend endpoint has a caller
        if: always()
        run: bun run test src/test/endpoint-reachability.test.ts

      # The SAME backend checkout, fifth question: does the pre-publish impact preview
      # still agree with the backend about when a revision may go live at all?
      #
      # `ReplayPanel` headlined "safe to go live" for a draft that produced NO OUTPUT for
      # every replayed order, because its `noImpact` excluded `errors` and an unrenderable
      # order scores `outputChanged: false`. The predicate already existed in
      # SupplierConnectionService (then `OrderCount == 0 || rendered > 0`); the frontend had
      # authored a second, weaker definition of the same idea instead of mirroring it.
      #
      # THAT PREDICATE HAS SINCE MOVED (backend PR 207): the leg now reports an OUTCOME, a
      # zero-order replay is `not_exercised` rather than a pass, and any render error fails
      # it. The spec below reads BOTH shapes and FAILS on a third — which is why no `ref:`
      # is pinned above and why this step must not be made conditional: the two repos deploy
      # independently, so this checkout is pre-207 until that PR merges and post-207 after.
      #
      # Runs HERE for the same reason as the two steps above: its backend assertions are
      # `test.skipIf(BACKEND === null)`, so in the unit-test job — which checks no backend
      # out — it would report green having compared nothing.
      - name: Diff the replay impact verdict against the backend C#
        if: always()
        run: bun run test src/test/replayImpactBackendMirror.test.ts

      # The SAME backend checkout, sixth question: does this build have a row for every
      # audit action the backend can write? `/operations/log` renders `GET /api/audit`'s
      # `action` verbatim, and an action with no row in src/lib/auditActionManifest.ts
      # renders as `unknown` — honest, but an unclassified failure nobody can filter for,
      # on the one screen that exists to show failures.
      #
      # ADDED 2026-08-15, because this job's own header defect had repeated one level down.
      # src/test/auditActionMirror.test.ts had NEVER run against a backend: it was not named
      # in this step list, and the unit-test job sets no PROCULINK_BACKEND_PATH, so its
      # `test.skipIf(!BACKEND)` diff reported green in every CI run since the file was
      # written. Watched fail first — backend #214 added `inbound_email.rejected_plan_gate`
      # and `inbound_email.rejected_order_limit`, and this step named exactly those two
      # before the manifest rows were written.
      - name: Diff the audit-action vocabulary against the backend C#
        if: always()
        run: bun run test src/test/auditActionMirror.test.ts

      # Seventh: is a delivery attempt's status still the same four-value vocabulary the
      # delivery rows are read with? The frontend used to answer this with a substring
      # match over an open string, which said "yes, delivered" for `undeliverable`.
      #
      # Same position as the step above: named nowhere, so never run against a backend.
      - name: Diff the delivery-attempt statuses against the backend C#
        if: always()
        run: bun run test src/test/deliveryAttemptMirror.test.ts

      # Eighth: does the check-run outcome vocabulary still match? A supplier connection may
      # only be published on a test pack that actually ran, and what this replaced was a
      # boolean that four backend paths set to `true` over a run which had executed nothing.
      # This suite reads two accepted backend versions and FAILS on a third, so it has to see
      # a real checkout to mean anything at all.
      - name: Diff the test-pack outcome vocabulary against the backend C#
        if: always()
        run: bun run test src/test/testPackOutcomeMirror.test.ts

      # Ninth: can the order screen render every source-document media type the server can
      # send? An unknown type renders as opaque bytes, and a type the frontend claims but the
      # server cannot send is dead code that reads as coverage. This one already honoured
      # PROCULINK_REQUIRE_BACKEND_MIRROR — it was simply never given a checkout to honour it
      # against, which is the same silent green by a different route.
      - name: Diff the source-document media types against the backend C#
        if: always()
        run: bun run test src/lib/sourceDocument.test.ts

      # Tenth: does the Settings webhook event menu offer every event the backend will
      # deliver? The mirror this diffs (src/lib/integrationEventManifest.ts) exists because
      # the menu was a private three-entry map while `IntegrationEventTypes.Subscribable`
      # had five — `order.dead_lettered` is the terminal "the order is NOT coming" signal,
      # so a customer wiring alerts could hear "this try failed" but never "we gave up".
      #
      # This step is the tenth mirror suite the WHY comment below anticipated, and it was
      # added because src/test/ciGatesReallyRun.test.ts refused the suite until it ran here:
      # its diff is `skipIf(!BACKEND)`, so in the unit-test job it reports green having
      # compared nothing.
      - name: Diff the integration-event catalogue against the backend C#
        if: always()
        run: bun run test src/lib/integrationEventManifest.test.tsx

      # WHY THE LIST ABOVE IS NOT WHERE TO STOP THINKING.
      #
      # Every step in this job runs a suite whose cross-repo assertions are `skipIf(!BACKEND)`.
      # A mirror suite that is NOT named here still runs — in the unit-test job, which checks
      # no backend out — where it skips its diff and reports green. FOUR of these nine were in
      # exactly that state on 2026-08-15. src/test/ciGatesReallyRun.test.ts now derives both
      # sides (every test file that reads a backend checkout, and every file this job runs) and
      # fails when they disagree, so a tenth mirror suite is enforced rather than remembered.
  # ══ END backend-mirror job ══════════════════════════════════════════════════

  test-e2e:
    name: Playwright e2e (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROCULINK_QA_BYPASS_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests (mock mode)
        run: bun run test:e2e

      # WP-02 — a skipped test is not a failure, but it must not be invisible either.
      #
      # This job used to report green while 31 of its 111 tests skipped, because the
      # `github` reporter prints only failure annotations and Playwright's runner counts
      # `skipped` as a non-failure. Nothing in the log, the check name, or the (failure-only)
      # artifact said which tests did not run or why.
      #
      # This step never fails the build — the declared-condition skips are correct by design.
      # It prints them, with their reasons, into the job log AND the check summary, so the
      # count is a number somebody can look at and challenge.
      - name: Skipped Playwright tests
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const FILE = "test-results/results.json";
          const out = [];

          if (!fs.existsSync(FILE)) {
            out.push(`No Playwright JSON report at ${FILE} — the run did not get far enough to write one.`);
          } else {
            const report = JSON.parse(fs.readFileSync(FILE, "utf8"));
            const skipped = [];

            const walk = (suite, titles) => {
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  const status = t.status ?? t.results?.[0]?.status;
                  if (status !== "skipped") continue;
                  const reason = (t.annotations ?? [])
                    .filter((a) => a.type === "skip" || a.type === "fixme")
                    .map((a) => a.description || `(${a.type}, no reason given)`)
                    .join("; ");
                  skipped.push({
                    where: `${spec.file}:${spec.line}`,
                    title: [...titles, spec.title].join(" › "),
                    reason: reason || "(NO REASON RECORDED — the skip cannot be justified from the report)",
                  });
                }
              }
              for (const child of suite.suites ?? []) walk(child, [...titles, child.title]);
            };
            for (const s of report.suites ?? []) walk(s, []);

            const st = report.stats ?? {};
            out.push(
              `Playwright: ${st.expected ?? "?"} passed · ${st.skipped ?? skipped.length} skipped · ` +
                `${st.unexpected ?? "?"} failed · ${st.flaky ?? 0} flaky`,
            );
            out.push("");
            if (skipped.length === 0) {
              out.push("No skipped tests — every test in this run actually ran.");
            } else {
              out.push(`${skipped.length} test(s) did NOT run:`);
              for (const s of skipped) out.push(`  - ${s.title}\n      ${s.where}\n      reason: ${s.reason}`);
            }
          }

          const text = out.join("\n");
          console.log(text);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Playwright skips\n\n\`\`\`\n${text}\n\`\`\`\n`,
            );
          }
          NODE

      # Uploaded on EVERY run, not just failures: a green run that skipped a third of the
      # suite is exactly the run somebody needs the report for.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # WP-41. Two jobs rather than two steps of `test-e2e`, for the reason the unit
  # job is already split into per-gate steps: a failure should name itself in the
  # checks UI. "Accessibility" and "Visual regression" are different questions with
  # different remedies, and burying both inside "Playwright e2e (mock mode)" would
  # mean a contrast regression and a broken upload flow report identically.
  #
  # They do not duplicate the e2e job. The a11y specs are tagged `@a11y`;
  # `test:e2e` filters that tag OUT and `test:e2e:a11y` filters it IN, and the
  # visual spec only runs in the three viewport projects, which `test:e2e`
  # (`--project=chromium`) never selects.
  test-a11y:
    name: Accessibility (axe-core + keyboard focus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROCULINK_QA_BYPASS_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same cache key as test-e2e so the two jobs share one browser download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # axe-core over the ten core screens (held by tests/e2e/a11y-baseline.json,
      # a two-sided ratchet) plus the measured keyboard-focus-visibility gate.
      - name: axe-core + focus visibility
        run: bun run test:e2e:a11y

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Responsive behaviour, at three widths ────────────────────────────────────
  #
  # Every other e2e job runs at ONE screen width. `playwright.config.ts` used to
  # say why — "the existing specs assert behaviour, which does not change with
  # viewport width" — and that is false here: 51 source files fork their DOM by
  # breakpoint, 110 controls exist only at 390px and 144 only at 1440px, and until
  # 2026-08-26 nothing could reach either set at its own width.
  #
  # This job runs the two things that are cheap enough to gate on:
  #
  #   control-sweep     40 routes x 390/768/1440 — every visible control's
  #                     accessible name, computed box, overflow; per page the
  #                     horizontal overflow, heading order and console errors
  #   the four journeys at 390 and 768 — first run to delivered, upload to
  #                     workshop, error recovery, sample order
  #
  # About five minutes. The CLICK pass — pressing all 589 controls — is 26 minutes
  # and is deliberately not here; see the note on the click-* projects in
  # playwright.config.ts.
  #
  # WHY IT IS BLOCKING. It was held back until the findings it opened were closed,
  # so it would not land a red main and teach everyone to ignore it. They are
  # closed: the last full run was 120 passed, zero P0s. A non-blocking check is one
  # people stop reading.
  #
  # WHAT IT ASSERTS is narrower than what it MEASURES, on purpose. Four things fail
  # the build — a route that did not render, a page that threw, console errors, and
  # a page-level horizontal scroll — and they are `expect.soft`, so one bad route
  # reports its finding without costing the other 39. Target-size and naming
  # findings are collected into .qa-sweep/ and printed. A gate that failed on 200
  # pre-existing findings would be disabled within a week.
  test-responsive:
    name: Responsive sweep (390 / 768 / 1440)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROCULINK_QA_BYPASS_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Sweep every route at three widths
        run: bun run sweep

      # The report is the review. A responsive failure a reviewer cannot look at is
      # a failure they will override — and the per-route records carry the findings
      # that are measured but not asserted, which is most of them.
      - name: Merge the per-route records into a report
        if: always()
        run: bun run sweep:report || true

      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-sweep
          path: .qa-sweep/
          retention-days: 14
          if-no-files-found: warn

  test-visual:
    name: Visual regression (390 / 768 / 1440)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROCULINK_QA_BYPASS_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The committed baselines are generated ON LINUX, for exactly this runner —
      # tests/e2e/visual.spec.ts refuses to run anywhere else, so a Windows or
      # macOS machine can never overwrite them with mismatched text rasterisation.
      # To refresh them, dispatch this workflow with regenerate_visual_baselines
      # (see the `on:` block at the top of this file) — the runner rewrites them and
      # uploads them as an artifact.
      - name: Screenshot comparison
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines) }}
        run: bun run test:e2e:visual

      # Regeneration. Reachable ONLY from a manual dispatch that explicitly asks
      # for it, so a pull request can never quietly rewrite its own baselines and
      # go green on the strength of the change it was supposed to be caught by.
      - name: Regenerate baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines }}
        run: bun run test:e2e:visual:update

      - name: Upload regenerated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          retention-days: 7

      # The diff images ARE the review. A visual failure that a reviewer cannot
      # look at is a failure they will override.
      - name: Upload visual diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
